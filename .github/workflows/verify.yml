name: Verify classroom release
on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main, preview]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_UMAMI_WEBSITE_ID: ${{ vars.VITE_UMAMI_WEBSITE_ID }}
          VITE_UMAMI_SCRIPT_URL: ${{ vars.VITE_UMAMI_SCRIPT_URL }}
          VITE_UMAMI_DOMAINS: ${{ vars.VITE_UMAMI_DOMAINS }}
          RELEASE_CHANNEL: ${{ github.ref == 'refs/heads/main' && 'stable' || 'preview' }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: classroom-${{ github.ref == 'refs/heads/main' && 'stable' || 'preview' }}
          path: dist
